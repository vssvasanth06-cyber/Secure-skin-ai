<!DOCTYPE html>
<html>
<head>
    <title>Book Appointment</title>

    <!-- Bootstrap + Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1d2b64, #f8cdda);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            color: white;
            animation: fadeIn 0.8s ease-in-out;
        }

        @keyframes fadeIn {
            from {opacity: 0; transform: translateY(20px);}
            to {opacity: 1; transform: translateY(0);}
        }

        .form-control, .form-select {
            border-radius: 12px;
            border: none;
            padding: 10px;
        }

        .form-control:focus, .form-select:focus {
            box-shadow: 0 0 10px rgba(255,255,255,0.6);
        }

        .btn-custom {
            background: linear-gradient(45deg, #00c6ff, #0072ff);
            border: none;
            border-radius: 12px;
            padding: 10px;
            font-weight: bold;
            color: white;
            transition: 0.3s;
        }

        .btn-custom:hover {
            transform: scale(1.05);
            background: linear-gradient(45deg, #0072ff, #00c6ff);
        }

        .title {
            font-weight: 600;
            text-align: center;
            margin-bottom: 20px;
        }

        .icon {
            font-size: 18px;
            margin-right: 5px;
        }
    </style>
</head>

<body>

<div class="glass-card">

    <h3 class="title">
        <i class="bi bi-calendar-check icon"></i>
        Book Appointment
    </h3>

    <form method="POST">
        {% csrf_token %}

        <!-- Doctor -->
        <div class="mb-3">
            <label class="form-label">
                <i class="bi bi-person-badge icon"></i>Select Doctor
            </label>
            <select name="doctor" class="form-select" required>
                {% for doc in doctors %}
                    <option value="{{ doc.user.id }}">
                        Dr. {{ doc.user.username }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <!-- Date -->
        <div class="mb-3">
            <label class="form-label">
                <i class="bi bi-calendar-event icon"></i>Date
            </label>
            <input type="date" name="date" class="form-control" required>
        </div>

        <!-- Time -->
        <div class="mb-3">
            <label class="form-label">
                <i class="bi bi-clock icon"></i>Time
            </label>
            <input type="time" name="time" class="form-control" required>
        </div>

        <!-- Submit -->
        <div class="d-grid mt-4">
            <button class="btn btn-custom">
                <i class="bi bi-check-circle"></i> Confirm Appointment
            </button>
        </div>

    </form>

</div>

</body>
</html>
