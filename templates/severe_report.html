<!DOCTYPE html>
<html lang="en">
<head>
    <title>Critical Condition Alert</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: radial-gradient(circle at top, #ff4e50, #8b0000, #000);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .glass {
            width: 780px;
            padding: 45px;
            border-radius: 30px;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(30px);
            box-shadow: 0 30px 100px rgba(0,0,0,0.6);
            color: white;
            text-align: center;
            animation: fadeIn 1s ease-in-out;
            position: relative;
        }

        @keyframes fadeIn {
            from {opacity: 0; transform: translateY(40px);}
            to {opacity: 1; transform: translateY(0);}
        }

        /* 🔴 PULSE EFFECT */
        .pulse {
            width: 90px;
            height: 90px;
            background: red;
            border-radius: 50%;
            margin: auto;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% {box-shadow: 0 0 0 0 rgba(255,0,0,0.7);}
            70% {box-shadow: 0 0 0 30px rgba(255,0,0,0);}
            100% {box-shadow: 0 0 0 0 rgba(255,0,0,0);}
        }

        .icon {
            font-size: 50px;
            color: #ff4d4d;
            margin-top: 10px;
        }

        h2 {
            margin-top: 15px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .warning-text {
            font-size: 15px;
            color: #ffcccc;
            margin-bottom: 15px;
        }

        .divider {
            height: 2px;
            margin: 15px 0;
            background: linear-gradient(to right, transparent, red, transparent);
        }

        .report-box {
            margin-top: 20px;
            background: rgba(255,255,255,0.12);
            padding: 25px;
            border-radius: 15px;
            line-height: 1.8;
            backdrop-filter: blur(10px);
            box-shadow: inset 0 0 20px rgba(255,255,255,0.1);
        }

        .btn-action {
            margin-top: 30px;
            padding: 15px 35px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            background: linear-gradient(135deg, #ff0000, #ff4e50);
            border: none;
            color: white;
            transition: 0.3s;
            box-shadow: 0 15px 40px rgba(255,0,0,0.5);
        }

        .btn-action:hover {
            transform: scale(1.1);
            box-shadow: 0 20px 60px rgba(255,0,0,0.7);
        }

        /* 🔥 BACKGROUND GLOW */
        .glass::before {
            content: "";
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(255,0,0,0.2);
            filter: blur(100px);
            top: -50px;
            left: -50px;
            z-index: -1;
        }

        .glass::after {
            content: "";
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(255,100,100,0.2);
            filter: blur(100px);
            bottom: -50px;
            right: -50px;
            z-index: -1;
        }
    </style>
</head>

<body>

<div class="glass">

    <!-- 🔴 PULSE -->
    <div class="pulse"></div>

    <!-- ⚠️ ICON -->
    <div class="icon">
        <i class="fas fa-exclamation-triangle"></i>
    </div>

    <h2>Critical Condition Detected</h2>

    <div class="warning-text">
        Immediate medical attention is required
    </div>

    <div class="divider"></div>

    <!-- 📄 REPORT -->
    <div class="report-box">
        {{ report_data }}
    </div>

    <!-- 🚑 ACTION -->
    <a href="{% url 'book_appointment' %}">
        <button class="btn-action">
            🚑 Book Emergency Appointment
        </button>
    </a>

</div>

</body>
</html>
